<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Master Password | Journey DNA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-deep: #031412;
            --emerald-surface: rgba(7, 61, 50, 0.72);
            --gold-accent: #D5B779;
            --gold-gradient: linear-gradient(135deg, #ECC880 0%, #D5B779 50%, #A58242 100%);
            --teal-accent: #54D1C6;
            --border-glass: rgba(84, 209, 198, 0.22);
        }

        body.reset-body {
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #083c32 0%, #031412 80%);
            color: #F8F9FA;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
        }

        .reset-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 1;
        }

        .reset-card {
            background: rgba(4, 28, 23, 0.92);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 2.75rem 2.25rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
        }

        .reset-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent 0%, var(--gold-accent) 50%, transparent 100%);
        }

        .brand-crest {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .crest-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(213, 183, 121, 0.12);
            border: 1px solid rgba(213, 183, 121, 0.35);
            font-size: 1.6rem;
            margin-bottom: 0.9rem;
        }

        .brand-title {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: #fff;
            margin: 0;
            text-transform: uppercase;
            font-weight: 700;
        }

        .portal-subtitle {
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--gold-accent);
            font-weight: 600;
            margin-top: 0.4rem;
        }

        .reset-desc {
            text-align: center;
            font-size: 0.88rem;
            color: rgba(248, 249, 250, 0.72);
            margin: 0 0 1.75rem 0;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 1.35rem;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(248, 249, 250, 0.85);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
        }

        .input-field {
            width: 100%;
            background: rgba(2, 18, 14, 0.75);
            border: 1px solid rgba(84, 209, 198, 0.28);
            border-radius: 12px;
            padding: 12px 14px 12px 42px;
            color: #fff;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            outline: none;
            box-sizing: border-box;
        }

        .input-field:focus {
            border-color: var(--gold-accent);
            box-shadow: 0 0 0 3px rgba(213, 183, 121, 0.2);
            background: rgba(2, 18, 14, 0.95);
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.05rem;
            color: rgba(84, 209, 198, 0.7);
        }

        .btn-submit {
            width: 100%;
            background: var(--gold-gradient);
            color: #031412;
            border: none;
            border-radius: 12px;
            padding: 13px 20px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(213, 183, 121, 0.3);
            transition: all 0.25s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(213, 183, 121, 0.45);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert-box {
            display: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.86rem;
            margin-bottom: 1.25rem;
            line-height: 1.5;
        }
        .alert-box.error {
            display: block;
            background: rgba(220, 38, 38, 0.18);
            border: 1px solid rgba(220, 38, 38, 0.45);
            color: #FCA5A5;
        }
        .alert-box.success {
            display: block;
            background: rgba(16, 185, 129, 0.18);
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: #6EE7B7;
        }

        .footer-nav {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid rgba(84, 209, 198, 0.15);
            font-size: 0.85rem;
        }
        .footer-nav a {
            color: var(--teal-accent);
            text-decoration: none;
        }
        .footer-nav a:hover {
            color: var(--gold-accent);
            text-decoration: underline;
        }
    </style>
</head>
<body class="reset-body">

    <div class="reset-wrapper">
        <div class="reset-card">
            
            <div class="brand-crest">
                <div class="crest-icon">🔒</div>
                <h1 class="brand-title">Create Password</h1>
                <div class="portal-subtitle">Owner Master Credentials</div>
            </div>

            <p class="reset-desc">
                Set a new, secure master password for your owner account. Your single-use recovery token will be verified.
            </p>

            <div id="alertBox" class="alert-box"></div>

            <form id="resetForm" onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label class="form-label" for="resetToken">Security Recovery Token</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔑</span>
                        <input 
                            type="text" 
                            id="resetToken" 
                            class="input-field" 
                            required 
                            placeholder="Paste recovery token"
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="newPassword">New Master Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🛡️</span>
                        <input 
                            type="password" 
                            id="newPassword" 
                            class="input-field" 
                            required 
                            minlength="6"
                            placeholder="Minimum 6 characters"
                        />
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirm Master Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">✓</span>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            class="input-field" 
                            required 
                            minlength="6"
                            placeholder="Re-enter password"
                        />
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    Set New Password
                </button>
            </form>

            <div class="footer-nav">
                <a href="owner_login.html">&larr; Return to Owner Login</a>
            </div>

        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        // Check for ?token= query parameter in URL on load
        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const token = params.get("token");
            if (token) {
                const tokenInput = document.getElementById("resetToken");
                if (tokenInput) {
                    tokenInput.value = token;
                }
            }
        });

        async function handleResetPassword(e) {
            e.preventDefault();
            const alertBox = document.getElementById("alertBox");
            const submitBtn = document.getElementById("submitBtn");
            const token = document.getElementById("resetToken").value.trim();
            const newPassword = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            alertBox.className = "alert-box";
            alertBox.style.display = "none";

            if (newPassword.length < 6) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "New password must be at least 6 characters long.";
                return;
            }

            if (newPassword !== confirmPassword) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Passwords do not match.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Updating Master Password...";

            try {
                const res = await apiFetch("/api/owner/reset-password", {
                    method: "POST",
                    body: {
                        token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    }
                });

                if (res.ok && res.data && res.data.success) {
                    alertBox.className = "alert-box success";
                    alertBox.innerHTML = `<strong>Password Updated!</strong><br>${res.data.message}<br><br><a href="owner_login.html" style="color:#031412; background:#D5B779; padding:8px 16px; border-radius:8px; display:inline-block; margin-top:8px; font-weight:700; text-decoration:none;">Proceed to Owner Login &rarr;</a>`;
                    document.getElementById("resetForm").style.display = "none";
                } else {
                    alertBox.className = "alert-box error";
                    alertBox.textContent = (res.data && res.data.message) ? res.data.message : "Password reset failed. Token may be invalid or expired.";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Set New Password";
                }
            } catch (err) {
                alertBox.className = "alert-box error";
                alertBox.textContent = "Connection error while updating password.";
                submitBtn.disabled = false;
                submitBtn.textContent = "Set New Password";
            }
        }
    </script>
</body>
</html>
